      <text x="92" y="26" font-size="15.5" font-weight="800" fill="#0F172A">원생 명단 일괄 등록 &amp; 다운로드</text>
      <text x="92" y="44" font-size="13" font-weight="600" fill="#64748B">2행 복합헤더 자동 파싱 &amp; 노선별 출력</text>

