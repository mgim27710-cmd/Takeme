    <text x="56" y="35" font-size="19" font-weight="900" fill="#312E81">TakeMe 코어 엔진 (NestJS 11)</text>
    <text x="395" y="35" font-size="13" font-weight="800" fill="#6366F1" text-anchor="end">Core Engine</text>

    <!-- 내부 핵심 모듈 리스트 (큰 글씨) -->
    <g transform="translate(18, 70)">
      <!-- 모듈 1: GIS AI 배차 -->
      <rect x="0" y="0" width="374" height="110" rx="10" fill="#F8FAFC" stroke="#C7D2FE" stroke-width="1.5" />
      <rect x="12" y="10" width="160" height="26" rx="5" fill="#E0E7FF" />
      <text x="92" y="28" font-size="13.5" font-weight="800" fill="#3730A3" text-anchor="middle">GIS &amp; AI 노선 최적화</text>
      <text x="14" y="56" font-size="14.5" font-weight="800" fill="#0F172A">• K-Means 군집화 : 탑승 정원 기준 균등 분할</text>
      <text x="14" y="78" font-size="14.5" font-weight="800" fill="#0F172A">• Convex Hull &amp; TSP : U턴 방지 최단 순회</text>
      <text x="14" y="98" font-size="13.5" font-weight="600" fill="#475569">• SK TMap 실시간 교통량 연계 정밀 ETA 산출</text>

      <!-- 모듈 2: WebSocket 관제 -->
      <rect x="0" y="122" width="374" height="110" rx="10" fill="#F8FAFC" stroke="#A7F3D0" stroke-width="1.5" />
      <rect x="12" y="132" width="185" height="26" rx="5" fill="#D1FAE5" />
      <text x="104" y="150" font-size="13.5" font-weight="800" fill="#065F46" text-anchor="middle">WebSocket / Socket.IO</text>
      <text x="14" y="178" font-size="14.5" font-weight="800" fill="#0F172A">• 0.2초 초저지연 양방향 위치 브로드캐스팅</text>
      <text x="14" y="200" font-size="14.5" font-weight="800" fill="#0F172A">• 노선별 소켓 룸(Room) 격리로 부하 85% 절감</text>
      <text x="14" y="220" font-size="13.5" font-weight="600" fill="#475569">• 네트워크 일시 단절 시 자동 재연결 및 보정</text>

      <!-- 모듈 3: 지오펜스 안전 알림 -->
      <rect x="0" y="244" width="374" height="110" rx="10" fill="#F8FAFC" stroke="#FDE68A" stroke-width="1.5" />
      <rect x="12" y="254" width="185" height="26" rx="5" fill="#FEF3C7" />
      <text x="104" y="272" font-size="13.5" font-weight="800" fill="#92400E" text-anchor="middle">Geo-fence &amp; Safety 알림</text>
      <text x="14" y="300" font-size="14.5" font-weight="800" fill="#0F172A">• 3단계 지오펜스(2km/500m/도착) 자동 판정</text>
      <text x="14" y="322" font-size="14.5" font-weight="800" fill="#0F172A">• FCM 푸시 알림으로 길거리 대기 80% 단축</text>
      <text x="14" y="342" font-size="13.5" font-weight="600" fill="#475569">• 운행 종료 후 미하차 아동 잔류 여부 자동 검증</text>

      <!-- 모듈 4: 데이터 & 보안 -->
      <rect x="0" y="366" width="374" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="14" y="394" font-size="14.5" font-weight="800" fill="#1E3A8A">💾 PostgreSQL 16 RDS : 원생/노선/승하차 트랜잭션</text>
      <text x="14" y="418" font-size="14.5" font-weight="800" fill="#1E3A8A">🗺️ Naver Maps Geocoding : 주소 ➔ 좌표 정밀 변환</text>
      <text x="14" y="442" font-size="14.5" font-weight="800" fill="#1E3A8A">🔐 Google TOTP 2FA &amp; ExcelJS 2행 복합헤더 파서</text>

      <!-- 모듈 5: 인프라 -->
      <rect x="0" y="468" width="374" height="52" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="187" y="500" font-size="14" font-weight="800" fill="#334155" text-anchor="middle">AWS EC2 Cloud · Nginx Reverse Proxy · WSS/HTTPS</text>
