      <text x="92" y="168" font-size="13" font-weight="600" fill="#64748B">0.2초 초저지연 동기화 &amp; 미하차 경보</text>

      <!-- 4 -->
      <rect x="0" y="186" width="345" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="10" y="196" width="70" height="34" rx="5" fill="#FEE2E2" />
