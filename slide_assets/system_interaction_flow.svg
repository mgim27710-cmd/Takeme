  <text x="1385" y="63" font-size="15" font-weight="800" fill="#2563EB" text-anchor="end">TakeMe Real-Time Architecture</text>

  <!-- ============================================================== -->
  <!-- 1. 좌측 상단: 학원 관리자 웹 대시보드 (Admin Web) -->
