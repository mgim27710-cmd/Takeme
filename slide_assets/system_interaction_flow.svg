<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860" style="background:#ffffff; font-family:'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
