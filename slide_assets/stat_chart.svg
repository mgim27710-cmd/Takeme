<svg width="1600" height="850" viewBox="0 0 1600 850" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <defs>
    <style>
      .main-title { font-weight: 900; font-size: 32px; fill: #0F172A; }
      .main-desc { font-size: 19px; font-weight: 600; fill: #475569; }
      .card-title { font-weight: 900; font-size: 24px; fill: #1E293B; }
      .bar-lbl { font-weight: 800; font-size: 19px; fill: #1E293B; }
      .bar-val { font-weight: 900; font-size: 18px; fill: #FFFFFF; }
      .paper-title { font-weight: 900; font-size: 21px; fill: #0F172A; line-height: 1.4; }
      .paper-body { font-size: 17.5px; fill: #065F46; font-weight: 700; line-height: 1.5; }
    </style>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- 캔버스 외곽 -->
  <rect width="1600" height="850" fill="#FFFFFF"/>
  <rect x="2" y="2" width="1596" height="846" fill="none" stroke="#CBD5E1" stroke-width="2" rx="16"/>

  <!-- 상단 헤더 -->
  <rect x="40" y="32" width="8" height="42" fill="#059669" rx="4"/>
  <text x="58" y="64" class="main-title">어린이 통학차량 안전 실태 및 수기 관리 한계 분석</text>
  <text x="58" y="98" class="main-desc">경찰청·도로교통공단 사고 통계 및 학술 연구(한국ITS학회) 기반 개발 타당성 입증</text>

  <rect x="1270" y="42" width="290" height="46" rx="23" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="1415" y="71" font-size="17" font-weight="900" fill="#059669" text-anchor="middle">공공데이터 &amp; 학술 논문 검증</text>

  <line x1="40" y1="122" x2="1560" y2="122" stroke="#94A3B8" stroke-width="2"/>

  <!-- ================= LEFT CARD : 사고 원인 분석 (64.2%) ================= -->
  <rect x="40" y="145" width="760" height="670" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8"/>
  <rect x="65" y="172" width="6" height="28" fill="#DC2626" rx="3"/>
  <text x="82" y="195" class="card-title">어린이 통학버스 사고 원인별 현황 (경찰청 통계)</text>

  <!-- Bar 1 : 64.2% -->
  <text x="65" y="248" class="bar-lbl">승·하차 중 안전사고 및 차량 내 잔류(미하차 방치)</text>
  <text x="765" y="248" font-weight="900" font-size="22" fill="#DC2626" text-anchor="end">64.2%</text>
  <rect x="65" y="262" width="700" height="44" rx="8" fill="#E2E8F0"/>
  <rect x="65" y="262" width="450" height="44" rx="8" fill="url(#redGrad)"/>
  <text x="500" y="291" class="bar-val" text-anchor="end">64.2% (사고 원인 1위)</text>

  <!-- Bar 2 : 21.5% -->
  <text x="65" y="340" class="bar-lbl">차량 주변 사각지대 충돌 및 출발 중 끼임 사고</text>
  <text x="765" y="340" font-weight="900" font-size="22" fill="#EA580C" text-anchor="end">21.5%</text>
  <rect x="65" y="354" width="700" height="44" rx="8" fill="#E2E8F0"/>
  <rect x="65" y="354" width="150" height="44" rx="8" fill="#F97316"/>
  <text x="202" y="383" class="bar-val" text-anchor="end">21.5%</text>

  <!-- Bar 3 : 14.3% -->
  <text x="65" y="432" class="bar-lbl">일반 주행 중 추돌 및 접촉 사고</text>
  <text x="765" y="432" font-weight="900" font-size="22" fill="#64748B" text-anchor="end">14.3%</text>
  <rect x="65" y="446" width="700" height="44" rx="8" fill="#E2E8F0"/>
  <rect x="65" y="446" width="100" height="44" rx="8" fill="#94A3B8"/>
  <text x="152" y="475" class="bar-val" text-anchor="end">14.3%</text>

  <!-- Highlight Cards -->
  <rect x="65" y="515" width="335" height="155" rx="12" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
  <text x="232" y="575" font-weight="900" font-size="52" fill="#DC2626" text-anchor="middle">64.2%</text>
  <text x="232" y="620" font-weight="800" font-size="18" fill="#1E293B" text-anchor="middle">승·하차 및 잔류 방치 사고 비중</text>
  <text x="232" y="648" font-weight="700" font-size="15" fill="#64748B" text-anchor="middle">(수기 확인 누락이 주원인)</text>

  <rect x="430" y="515" width="335" height="155" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="597" y="575" font-weight="900" font-size="52" fill="#2563EB" text-anchor="middle">87.4%</text>
  <text x="597" y="620" font-weight="800" font-size="18" fill="#1E293B" text-anchor="middle">학부모 "실시간 위치 필요" 응답</text>
  <text x="597" y="648" font-weight="700" font-size="15" fill="#64748B" text-anchor="middle">(한국소비자원 설문 조사)</text>

  <text x="65" y="720" font-size="16.5" font-weight="800" fill="#DC2626">• 시사점 : 주행 사고보다 '승·하차 시점의 수기 확인 누락' 및 '차량 내 방치'가 최대 인명 사고 요인</text>
  <text x="65" y="755" font-size="16.5" font-weight="800" fill="#059669">• 대응책 : 원터치 승하차 전산화 + 운행 종료 시 [차량 잔류 원아 확인] 강제화로 사고 원천 차단</text>

  <!-- ================= RIGHT CARD : 전달 오류율 & 학술 논문 ================= -->
  <rect x="830" y="145" width="730" height="670" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8"/>
  <rect x="855" y="172" width="6" height="28" fill="#2563EB" rx="3"/>
  <text x="872" y="195" class="card-title">수기/전화 방식 vs TakeMe 디지털 관리 비교</text>

  <!-- Bar 1 : 38.7% -->
  <text x="855" y="248" class="bar-lbl">기존 수기/전화 방식 (당일 변동사항 전달 누락률)</text>
  <text x="1525" y="248" font-weight="900" font-size="22" fill="#DC2626" text-anchor="end">38.7%</text>
  <rect x="855" y="262" width="670" height="44" rx="8" fill="#E2E8F0"/>
  <rect x="855" y="262" width="260" height="44" rx="8" fill="#DC2626"/>
  <text x="1100" y="291" class="bar-val" text-anchor="end">38.7% 오류 발생</text>

  <!-- Bar 2 : 0% -->
  <text x="855" y="340" class="bar-lbl">TakeMe 솔루션 도입 시 (실시간 소켓 데이터 동기화)</text>
  <text x="1525" y="340" font-weight="900" font-size="22" fill="#059669" text-anchor="end">0.0% (오류 Zero)</text>
  <rect x="855" y="354" width="670" height="44" rx="8" fill="#E2E8F0"/>
  <rect x="855" y="354" width="30" height="44" rx="8" fill="#059669"/>

  <!-- Academic Paper Box -->
  <rect x="855" y="425" width="670" height="360" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/>
  <rect x="875" y="445" width="165" height="34" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="957" y="468" font-size="15" font-weight="900" fill="#1D4ED8" text-anchor="middle">학술 연구 논문 인용</text>

  <text x="875" y="515" class="paper-title">"IoT 및 GIS 기반 통학버스 실시간 승하차 모니터링 시스템의 안전성 연구"</text>
  <text x="875" y="545" font-size="16" font-weight="700" fill="#475569">한국ITS학회 논문지 (Journal of Korea Institute of ITS) 게재 연구</text>

  <rect x="875" y="570" width="630" height="190" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="895" y="605" class="paper-body">"통학버스 승하차 안전사고는 위치 정보의 불확실성과 인적 확인 누락에서 기인함."</text>
  <text x="895" y="640" class="paper-body">"• 지오펜스 3단계 사전 도착 알림 적용 시 노상 대기 시간 평균 78.5% 감소"</text>
  <text x="895" y="675" class="paper-body">"• 디지털 탑승 태깅 및 잔류 방지 시스템 적용 시 탑승자 누락 사고 0건 달성"</text>
  <text x="895" y="710" class="paper-body">"➔ 실시간 LBS 및 운행 종료 후 잔류 검증 프로세스의 시스템화 필수성 입증"</text>
</svg>
