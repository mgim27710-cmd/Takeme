      <path d="M30 18c-7 0-11 4-11 11v8c0 7 4 11 11 11s11-4 11-11v-8c0-7-4-11-11-11zm0 24c-3 0-5-2-5-5v-6c0-3 2-5 5-5s5 2 5 5v6c0 3-2 5-5 5z" fill="#FFFFFF"/>
    </g>
  
