version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: takeme-dev-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: takeme_dev
    ports:
      - '5432:5432'
    volumes:
      - takeme_dev_pgdata:/var/lib/postgresql/data

volumes:
  takeme_dev_pgdata:
